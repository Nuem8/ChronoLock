<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>NueM8 ChronoLock</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="lockup">
    <img src="/logo.png" alt="" width="112" height="112">
    <div class="lockup-copy">
      <h1>NueM8 ChronoLock</h1>
      <p class="tagline">Precision credential dispatch. Forged in local memory, dissolved by time.</p>
      <ul class="marks">
        <li>Single-Use AES-256</li>
        <li>100% Client-Side Encryption</li>
        <li>Zero Telemetry</li>
      </ul>
    </div>
  </div>
  <main id="app"></main>
  <footer class="legal">
    <nav aria-label="NueM8">
      <a href="https://nuem8.com/philosophy" target="_blank" rel="noreferrer noopener">Design philosophy</a>
      <a href="https://nuem8.com/privacy" target="_blank" rel="noreferrer noopener">Privacy Policy</a>
      <a href="https://nuem8.com/disclaimer" target="_blank" rel="noreferrer noopener">Disclaimer</a>
    </nav>
  </footer>
  <noscript>
    <p>ChronoLock encrypts the secret in this browser. Turn on JavaScript to use it. The server cannot decrypt a secret.</p>
  </noscript>
  <script src="/app.js"></script>
</body>
</html>
