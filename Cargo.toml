[package]
name = "chronolock"
version = "0.1.0"
edition = "2021"
description = "NueM8 ChronoLock — secret links that die after one reveal or a set time"
license = "GPL-3.0-only"
publish = false

[dependencies]
axum = "0.7.9"
base64 = "0.22"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
